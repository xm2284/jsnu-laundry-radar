<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="蹲守通知">
  <title>蹲守通知 · 一有空位立刻提醒</title>
  <defs>
    <filter id="fw-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fw-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fw-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0.07 0"/>
    </filter>
    <style>
      @keyframes fw-swing { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
      .fw-bell { transform-origin: 168px 120px; animation: fw-swing 1.5s ease-in-out infinite; }
      @keyframes fw-pop { 0%,50% { transform: scale(.6); opacity:0; } 62% { transform: scale(1.06); opacity:1; } 78%,100% { transform: scale(1); opacity:1; } }
      .fw-notif { transform-origin: 300px 96px; animation: fw-pop 3.2s ease-in-out infinite; }
      @keyframes fw-sound { 0% { opacity:.9; transform: scale(.6); } 100% { opacity:0; transform: scale(1.5); } }
      .fw-sound { transform-origin: 168px 118px; animation: fw-sound 1.5s ease-out infinite; }
      @keyframes fw-hand { to { transform: rotate(360deg); } }
      .fw-hand { transform-origin: 430px 250px; animation: fw-hand 8s linear infinite; }
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
    </style>
  </defs>

  <rect x="4" y="4" width="552" height="332" rx="22" fill="#FFFDF6" stroke="#33302B" stroke-width="3.4" filter="url(#fw-rough)"/>
  <rect x="4" y="4" width="552" height="332" rx="22" fill="#fff" filter="url(#fw-paper)"/>
  <rect x="440" y="12" width="86" height="26" rx="3" fill="#FBE3D8" stroke="#33302B" stroke-width="2" transform="rotate(5 483 25)" filter="url(#fw-rough2)" opacity=".9"/>

  <g class="hw" filter="url(#fw-rough2)">
    <text x="150" y="58" font-size="30" font-weight="700" fill="#33302B">② 蹲守通知</text>
    <path d="M150 70 q 80 8 160 0" fill="none" stroke="#F2C14E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- bell -->
  <g fill="none" stroke="#E8745B" stroke-width="3">
    <circle class="fw-sound" cx="168" cy="118" r="46"/>
  </g>
  <g class="fw-bell" filter="url(#fw-rough)">
    <path d="M168 90 a 34 34 0 0 1 34 34 l 6 32 12 12 -104 0 12 -12 6 -32 a 34 34 0 0 1 34 -34z" fill="#F2C14E" stroke="#33302B" stroke-width="4"/>
    <rect x="156" y="78" width="24" height="12" rx="6" fill="#F2C14E" stroke="#33302B" stroke-width="3.4"/>
    <path d="M168 174 a 10 10 0 0 0 20 0z" fill="#E8745B" stroke="#33302B" stroke-width="3.4"/>
  </g>

  <!-- notification bubble -->
  <g class="fw-notif" filter="url(#fw-rough2)">
    <rect x="228" y="72" width="304" height="52" rx="12" fill="#FFF7E6" stroke="#33302B" stroke-width="3"/>
    <path d="M236 98 l -22 10 6 -22z" fill="#FFF7E6" stroke="#33302B" stroke-width="3"/>
    <g class="hw">
      <text x="246" y="98" font-size="19" fill="#E8745B">🔔 4 楼 A3 空出来啦！</text>
      <text x="246" y="116" font-size="15" fill="#33302B">边沿触发 · 30 分钟冷却，不打扰</text>
    </g>
  </g>

  <!-- clock -->
  <g filter="url(#fw-rough2)">
    <circle cx="430" cy="250" r="62" fill="#DDEEF9" stroke="#33302B" stroke-width="4"/>
    <circle cx="430" cy="250" r="50" fill="#ffffff" stroke="#33302B" stroke-width="2.4"/>
    <g stroke="#33302B" stroke-width="2.4" stroke-linecap="round">
      <path d="M430 214 l 0 6 M430 280 l 0 6 M394 250 l 6 0 M460 250 l 6 0"/>
    </g>
    <g class="fw-hand">
      <line x1="430" y1="250" x2="430" y2="214" stroke="#E8745B" stroke-width="4" stroke-linecap="round"/>
    </g>
    <line x1="430" y1="250" x2="456" y2="266" stroke="#33302B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="430" cy="250" r="6" fill="#33302B"/>
  </g>
  <g class="hw" filter="url(#fw-rough2)">
    <text x="392" y="334" font-size="16" fill="#33302B">TTL 到点自动停止</text>
  </g>

  <!-- relaxed person doodle -->
  <g filter="url(#fw-rough2)" stroke="#33302B" stroke-width="3.2" fill="none" stroke-linecap="round">
    <circle cx="86" cy="216" r="20" fill="#FBE3D8"/>
    <path d="M60 300 q 26 -46 52 0"/>
    <path d="M86 236 v 40" stroke="#33302B"/>
    <path d="M86 252 l -26 18 M86 252 l 26 18"/>
    <path d="M70 300 l -14 26 M102 300 l 14 26"/>
  </g>
  <g class="hw" filter="url(#fw-rough2)">
    <text x="36" y="176" font-size="16" fill="#33302B">在寝室等着就好</text>
  </g>
</svg>
