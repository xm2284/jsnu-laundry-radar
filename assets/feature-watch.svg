<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" aria-label="蹲守通知">
  <title>蹲守通知 · 一有空位立刻提醒</title>
  <defs>
    <filter id="fw-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.022" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fw-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fw-paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.4 0 0 0 0.07 0"/>
    </filter>
    <style>
      @keyframes fw-swing { 0%,100% { transform: rotate(-13deg); } 50% { transform: rotate(13deg); } }
      .fw-bell { transform-origin: 176px 80px; animation: fw-swing 1.6s ease-in-out infinite; }
      @keyframes fw-pop { 0% { transform: scale(1); } 8% { transform: scale(1.05); } 16%,100% { transform: scale(1); } }
      .fw-notif { transform-origin: 405px 116px; animation: fw-pop 3.2s ease-in-out infinite; }
      @keyframes fw-sound { 0% { opacity:.85; transform: scale(.6); } 100% { opacity:0; transform: scale(1.45); } }
      .fw-sound { transform-origin: 176px 150px; animation: fw-sound 1.6s ease-out infinite; }
      @keyframes fw-hand { to { transform: rotate(360deg); } }
      .fw-hand { transform-origin: 452px 256px; animation: fw-hand 8s linear infinite; }
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
    </style>
  </defs>

  <rect x="4" y="4" width="552" height="332" rx="22" fill="#FFFDF6" stroke="#33302B" stroke-width="3.4" filter="url(#fw-rough)"/>
  <rect x="4" y="4" width="552" height="332" rx="22" fill="#fff" filter="url(#fw-paper)"/>
  <rect x="440" y="12" width="86" height="26" rx="3" fill="#FBE3D8" stroke="#33302B" stroke-width="2" transform="rotate(5 483 25)" filter="url(#fw-rough2)" opacity=".9"/>

  <g class="hw" filter="url(#fw-rough2)">
    <text x="150" y="58" font-size="30" font-weight="700" fill="#33302B">② 蹲守通知</text>
    <path d="M150 70 q 90 8 180 0" fill="none" stroke="#F2C14E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- sound waves + bell -->
  <g fill="none" stroke="#E8745B" stroke-width="3">
    <circle class="fw-sound" cx="176" cy="150" r="60"/>
  </g>
  <g class="fw-bell" filter="url(#fw-rough)">
    <path d="M176 94 a 44 44 0 0 1 44 44 l 8 38 14 14 -132 0 14 -14 8 -38 a 44 44 0 0 1 44 -44z" fill="#F2C14E" stroke="#33302B" stroke-width="4"/>
    <rect x="162" y="78" width="28" height="14" rx="7" fill="#F2C14E" stroke="#33302B" stroke-width="3.4"/>
    <path d="M166 192 a 10 10 0 0 0 20 0z" fill="#E8745B" stroke="#33302B" stroke-width="3.4"/>
  </g>

  <!-- notification bubble -->
  <g class="fw-notif" filter="url(#fw-rough2)">
    <rect x="268" y="86" width="274" height="60" rx="13" fill="#FFF7E6" stroke="#33302B" stroke-width="3"/>
    <path d="M276 108 l -20 12 6 -22z" fill="#FFF7E6" stroke="#33302B" stroke-width="3"/>
    <g class="hw">
      <text x="288" y="114" font-size="19" fill="#E8745B">4 楼 A3 空出来啦！</text>
      <text x="288" y="136" font-size="14" fill="#33302B">边沿触发 · 30 分钟冷却，不打扰</text>
    </g>
  </g>

  <!-- clock -->
  <g filter="url(#fw-rough2)">
    <circle cx="452" cy="256" r="52" fill="#DDEEF9" stroke="#33302B" stroke-width="4"/>
    <circle cx="452" cy="256" r="41" fill="#ffffff" stroke="#33302B" stroke-width="2.4"/>
    <g stroke="#33302B" stroke-width="2.4" stroke-linecap="round">
      <path d="M452 224 l 0 6 M452 286 l 0 6 M420 256 l 6 0 M484 256 l 6 0"/>
    </g>
    <g class="fw-hand">
      <line x1="452" y1="256" x2="452" y2="228" stroke="#E8745B" stroke-width="4" stroke-linecap="round"/>
    </g>
    <line x1="452" y1="256" x2="474" y2="270" stroke="#33302B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="452" cy="256" r="5" fill="#33302B"/>
  </g>
  <g class="hw" filter="url(#fw-rough2)">
    <text x="398" y="332" font-size="15" fill="#33302B">TTL 到点自动停止</text>
  </g>

  <!-- relaxed resident doodle (cute) -->
  <g filter="url(#fw-rough2)">
    <ellipse cx="98" cy="314" rx="60" ry="18" fill="#DDEEF9" stroke="#33302B" stroke-width="3"/>
    <path d="M66 304 q 0 -48 32 -48 q 32 0 32 48 z" fill="#E4F1DE" stroke="#33302B" stroke-width="3"/>
    <circle cx="98" cy="238" r="21" fill="#FBE3D8" stroke="#33302B" stroke-width="3"/>
    <path d="M78 234 q 4 -24 20 -24 q 16 0 20 24 q -9 -11 -20 -9 q -12 2 -20 9z" fill="#6B5B4B" stroke="#33302B" stroke-width="2.6"/>
    <circle cx="91" cy="240" r="2.6" fill="#33302B"/>
    <circle cx="106" cy="240" r="2.6" fill="#33302B"/>
    <path d="M91 249 q 8 7 15 0" fill="none" stroke="#33302B" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="82" cy="247" r="4" fill="#F6B7A8" opacity=".8"/>
    <circle cx="115" cy="247" r="4" fill="#F6B7A8" opacity=".8"/>
    <!-- arms + phone -->
    <path d="M72 276 q 12 12 22 12" fill="none" stroke="#33302B" stroke-width="3" stroke-linecap="round"/>
    <path d="M124 276 q -12 12 -22 12" fill="none" stroke="#33302B" stroke-width="3" stroke-linecap="round"/>
    <rect x="87" y="284" width="22" height="30" rx="4" fill="#FFFDF6" stroke="#33302B" stroke-width="2.6"/>
    <path d="M92 292 h 12" stroke="#7FB2E5" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g class="hw" filter="url(#fw-rough2)">
    <text x="22" y="220" font-size="16" fill="#33302B">在寝室等着就好</text>
  </g>
</svg>
