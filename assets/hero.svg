<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="JSNU 洗衣雷达 · 海乐生活版 手绘风横幅">
  <title>JSNU 洗衣雷达 · 海乐生活版</title>
  <defs>
    <filter id="hero-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="hero-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="hero-paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8" result="t"/>
      <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.40  0 0 0 0.07 0"/>
    </filter>
    <linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FBF1E0"/>
    </linearGradient>
    <style>
      .hw { font-family: 'Comic Sans MS','Segoe Print','Bradley Hand','KaiTi','STKaiti',cursive; }
    </style>
  </defs>

  <!-- paper -->
  <rect x="5" y="5" width="990" height="420" rx="26" fill="url(#hero-sky)" stroke="#33302B" stroke-width="3.5" filter="url(#hero-rough)"/>
  <rect x="5" y="5" width="990" height="420" rx="26" fill="#ffffff" filter="url(#hero-paper)"/>
  <g stroke="#33302B" stroke-width="2" opacity="0.22" fill="none" filter="url(#hero-rough2)">
    <path d="M40 396 q 120 -12 240 0 t 240 0 t 240 0 t 180 -2"/>
  </g>

  <!-- doodles: stars / plus / sparks -->
  <g class="hero-tilt" stroke="#33302B" stroke-width="2.4" fill="none" stroke-linecap="round" filter="url(#hero-rough2)">
    <path d="M66 96 l 0 18 M57 105 l 18 0"/>
    <path d="M110 150 l 0 12 M104 156 l 12 0" stroke="#E8745B"/>
    <path d="M340 62 l 8 16 16 3 -12 11 3 16 -15 -8 -15 8 3 -16 -12 -11 16 -3z" fill="#F2C14E" stroke="#33302B"/>
    <path d="M330 344 l 0 14 M323 351 l 14 0" stroke="#6FBFB0"/>
    <path d="M296 352 q 18 10 36 0" stroke="#7FB2E5"/>
    <path d="M40 300 q 16 -12 30 2" stroke="#8FBF6F"/>
  </g>

  <!-- radar waves from machine -->
  <g fill="none" stroke="#E8745B" stroke-width="3.4" stroke-linecap="round">
    <path class="hero-wave" d="M300 196 a 40 40 0 0 1 -14 -30" opacity=".8"/>
    <path class="hero-wave w2" d="M300 196 a 68 68 0 0 1 -24 -52" opacity=".7"/>
    <path class="hero-wave w3" d="M300 196 a 96 96 0 0 1 -34 -74" opacity=".6"/>
  </g>

  <!-- washing machine -->
  <g filter="url(#hero-rough)">
    <rect x="110" y="146" width="192" height="256" rx="18" fill="#BFE3DC" stroke="#33302B" stroke-width="4"/>
    <rect x="128" y="164" width="156" height="42" rx="10" fill="#FFF7E6" stroke="#33302B" stroke-width="3"/>
    <circle cx="152" cy="185" r="11" fill="#F2C14E" stroke="#33302B" stroke-width="3"/>
    <circle cx="182" cy="185" r="8" fill="none" stroke="#33302B" stroke-width="3"/>
    <rect x="240" y="176" width="30" height="18" rx="4" fill="#7FB2E5" stroke="#33302B" stroke-width="3"/>
  </g>
  <circle cx="205" cy="292" r="74" fill="#ffffff" stroke="#33302B" stroke-width="5" filter="url(#hero-rough)"/>
  <circle cx="205" cy="292" r="60" fill="#DFF1FB" stroke="#33302B" stroke-width="3" filter="url(#hero-rough)"/>
  <g class="hero-drum" filter="url(#hero-rough2)">
    <path d="M205 244 q 16 14 34 30" fill="none" stroke="#7FB2E5" stroke-width="5" stroke-linecap="round"/>
    <path d="M157 300 q 22 -10 44 6 t 46 -2" fill="none" stroke="#7FB2E5" stroke-width="5" stroke-linecap="round"/>
    <path d="M252 282 q -14 12 -30 26" fill="none" stroke="#9FCBEA" stroke-width="5" stroke-linecap="round"/>
    <circle cx="205" cy="292" r="8" fill="#F2C14E" stroke="#33302B" stroke-width="2.4"/>
  </g>
  <!-- bubbles -->
  <g fill="none" stroke="#7FB2E5" stroke-width="3" stroke-linecap="round">
    <circle class="hero-bub" cx="150" cy="132" r="7"/>
    <circle class="hero-bub b2" cx="172" cy="126" r="5"/>
    <circle class="hero-bub b3" cx="132" cy="118" r="4"/>
  </g>

  <!-- title -->
  <g class="hw" filter="url(#hero-rough2)">
    <text x="350" y="152" font-size="54" font-weight="700" fill="#33302B">JSNU 洗衣雷达</text>
    <rect x="356" y="168" width="366" height="15" rx="7" fill="#F2C14E" opacity="0.55"/>
    <text x="356" y="216" font-size="22" fill="#2E2A26">宿舍洗衣机 · 空闲雷达 · 蹲守 · 洗完提醒</text>
    <path d="M356 226 q 110 8 190 0 t 190 0" fill="none" stroke="#E8745B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- platform tag -->
  <g filter="url(#hero-rough2)">
    <rect x="354" y="246" width="384" height="46" rx="23" fill="#6FBFB0" stroke="#33302B" stroke-width="3.2"/>
    <g class="hw">
      <text x="376" y="276" font-size="20" fill="#0F2B26">基于 海乐生活 (Haile Life) 平台</text>
    </g>
  </g>

  <!-- phone with machine list -->
  <g filter="url(#hero-rough)">
    <rect x="762" y="150" width="176" height="252" rx="22" fill="#FFFDF6" stroke="#33302B" stroke-width="4"/>
    <rect x="776" y="166" width="148" height="220" rx="14" fill="#FDF3E0" stroke="#33302B" stroke-width="2.6"/>
    <rect x="826" y="158" width="48" height="8" rx="4" fill="#33302B" opacity=".7"/>
  </g>
  <g class="hw" filter="url(#hero-rough2)">
    <text x="790" y="196" font-size="15" fill="#33302B">二组团 · 4F</text>
    <g stroke="#33302B" stroke-width="2" fill="#ffffff">
      <rect x="786" y="208" width="128" height="30" rx="8"/>
      <rect x="786" y="244" width="128" height="30" rx="8"/>
      <rect x="786" y="280" width="128" height="30" rx="8"/>
      <rect x="786" y="316" width="128" height="30" rx="8"/>
    </g>
    <circle cx="802" cy="223" r="7" fill="#7BC47F" class="hero-dot"/>
    <circle cx="802" cy="259" r="7" fill="#6FA8DC"/>
    <circle cx="802" cy="295" r="7" fill="#F2A65A"/>
    <circle cx="802" cy="331" r="7" fill="#E8745B"/>
    <text x="820" y="228" font-size="14" fill="#33302B">A3 空闲</text>
    <text x="820" y="264" font-size="14" fill="#33302B">B1 运行 12m</text>
    <text x="820" y="300" font-size="14" fill="#33302B">C2 已约</text>
    <text x="820" y="336" font-size="14" fill="#33302B">D1 故障</text>
  </g>

  <!-- notification toast (always visible) -->
  <g class="hero-notif" filter="url(#hero-rough2)">
    <rect x="560" y="30" width="300" height="54" rx="13" fill="#FFF7E6" stroke="#33302B" stroke-width="3"/>
    <g class="hw">
      <text x="580" y="64" font-size="19" fill="#E8745B">叮！3 楼有机器空出来啦</text>
    </g>
    <g stroke="#F2C14E" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M862 40 l 14 -10 M866 56 l 16 2 M860 70 l 12 12"/>
    </g>
  </g>

  <!-- bell -->
  <g class="hero-bell" filter="url(#hero-rough2)">
    <path d="M902 66 a 20 20 0 0 1 20 20 l 4 20 8 8 -64 0 8 -8 4 -20 a 20 20 0 0 1 20 -20z" fill="#F2C14E" stroke="#33302B" stroke-width="3.4"/>
    <circle cx="902" cy="122" r="7" fill="#E8745B" stroke="#33302B" stroke-width="3"/>
    <path d="M902 60 l 0 -8" stroke="#33302B" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- bottom tech tags -->
  <g class="hw" filter="url(#hero-rough2)">
    <g stroke="#33302B" stroke-width="2.4">
      <rect x="354" y="318" width="102" height="40" rx="12" fill="#FBE3D8"/>
      <rect x="466" y="318" width="90" height="40" rx="12" fill="#DDEEF9"/>
      <rect x="566" y="318" width="158" height="40" rx="12" fill="#E4F1DE"/>
    </g>
    <text x="372" y="344" font-size="16" fill="#33302B">Android</text>
    <text x="482" y="344" font-size="16" fill="#33302B">Kotlin</text>
    <text x="582" y="344" font-size="16" fill="#33302B">Jetpack Compose</text>
  </g>
</svg>
